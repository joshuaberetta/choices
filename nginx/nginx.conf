upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name choices.imtools.info localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect no-trailing-slash variants so Django never issues the redirect
    location = /admin { return 301 $scheme://$http_host/admin/; }
    location = /api   { return 301 $scheme://$http_host/api/; }

    # Django admin
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django REST API
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files (served by WhiteNoise via backend)
    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # KoboToolbox CSV export: /<project_id>/<list_name>.csv
    location ~ ^/[^/]+/[^/]+\.csv$ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # KoboToolbox add/remove: /<project_id>/<list_name>/add or /remove
    location ~ ^/[^/]+/[^/]+/(add|remove)$ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA — serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
