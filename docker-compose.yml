services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    volumes:
      - sqlite_data:/app/db.sqlite3
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
